name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned so the bundle this job rebuilds is byte-identical to the
      # committed one; bump the lockfile and this version together.
      - name: Install build tool
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12

      - name: Host syntax
        run: |
          for file in index.js src/host/*.js scripts/*.mjs tests/*.mjs; do
            node --check "$file"
          done

      - name: Manifest consistency
        run: node scripts/check-manifest.mjs

      - name: Unit tests
        run: node tests/slice-window.mjs

      - name: Rebuild the client bundle and fail on drift
        run: |
          node scripts/build-client.mjs
          git diff --exit-code -- dist/client.js
